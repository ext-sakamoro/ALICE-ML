# ALICE-Law conformance manifest for this crate (alice-ml). One entry per gate
# defined in ALICE-Law's conformance/gates.toml; the schema (status / evidence /
# mutant / since / note / reference_repo) is the "Manifest" section of
# docs/CONFORMANCE.md in that repository.
#
# Every entry is written from what this repository's tree at the commit below
# shows, checked directly: the CI clippy commands run locally on a fresh clone
# (default features, the full native feature set, the native set with neon, and
# pyo3), cargo test --lib --tests in debug and release, scripts/check_g1_banned_list.py
# and its tests, ALICE-Law's public_text_check.py, and probe functions added to
# library source and then reverted (the probes are quoted in the notes with the
# exit code each CI command gave).
#
# Premise shared by G6, G7 and G8: this crate is treated as Law-bearing pending the owner's scope decision (docs/CONFORMANCE.md, Out of scope, names ML activations and inference numerics as outside).
#
# No cell is `pass` (10 `fail-known`, 4 `unverified`). The one gate this crate has wired (G1: clippy.toml, the
# pinned list check, the list test) has a gap that the hole rule makes visible:
# no CI job lints the pyo3 feature, so a banned call in src/python.rs is read by
# no layer. `fail-known` says where the requirement is unmet. `unverified` says
# what could not be decided and why.
#
# Checked at: c90d3b8 (origin/main, 2026-10-15), probes run on aarch64 macOS with
# rustc 1.98.1 (the rust-toolchain.toml pin); the x86_64-only code (the AVX2 kernel
# under the simd feature) was not run locally and is covered only by the CI
# ubuntu-latest clippy jobs.

[G1]
status = "unverified"
note = "layers that read: clippy.toml bans all 25 of G1's banned methods for f32 and f64 (plus powi and mul_add for both widths, and the reasons are in the file; tests/g1_disallowed_methods_complete.rs and scripts/check_g1_banned_list.py, CI job law-g1-banned-list at ci.yml:199, compare the list against the revision pinned in .github/law-g1-pin; the check printed `ok: clippy.toml bans all 25 of G1's banned methods for both widths`), and the CI clippy commands run `-D warnings` (so clippy::disallowed_methods is an error) at ci.yml:87 (default features, all targets), ci.yml:89 (full native feature set ffi,simd,parallel,safetensors,db, all targets, pedantic and nursery), ci.yml:51 (native set plus neon, on macos-latest) and the no_std rlib clippy step. Measured 2026-10-15 by adding `x.sin()` to a library file and reverting: src/math.rs under the ci.yml:87 command rc=101 `use of a disallowed method f32::sin`; src/lib.rs under ci.yml:87 rc=101; src/safetensors.rs (feature-gated) under ci.yml:87 rc=0 (not built there) and under ci.yml:89 rc=101; src/db_bridge.rs (db) under ci.yml:89 rc=101; src/neon.rs under ci.yml:51 rc=101 and under ci.yml:89 rc=0 (neon is built only by the neon job). Not read by any layer: the pyo3 feature. NATIVE_FEATURES (ci.yml:23) leaves out pyo3 and neon on purpose, neon has its own job, pyo3 has none: an `x.sin()` added to src/python.rs passed ci.yml:87, ci.yml:89 and ci.yml:51 (rc=0 each) and was caught only by `cargo clippy --lib --features pyo3 -- -D warnings` (rc=101), a command no workflow runs. Today's src/python.rs has no banned call (that same pyo3 clippy command on the unmodified tree: rc=0), so this is an unlinted form, not a located violation. The canary the gate names is scripts/clippy_canary.py (ci.yml:102 in the clippy job, scripts/preflight.sh line 75): it plants each row of scripts/clippy_canary_calls.tsv in a throwaway crate that copies clippy.toml and requires exactly one disallowed diagnostic naming it, and every clippy.toml entry must have exactly one row; scripts/gen_clippy_canary_calls.py generates the rows from clippy.toml, one per disallowed-methods / disallowed-types entry (54 planted, 0 skipped), and its --check (ci.yml:98) compares the bytes, so the lint itself is checked for every entry, not only the list. Mutant measured on the list layer: removing the `f32::sin` entry from clippy.toml turns tests/g1_disallowed_methods_complete.rs::clippy_toml_bans_every_g1_method_for_both_widths red (`missing 1 of G1's 25 banned methods: ['f32::sin']`) and scripts/check_g1_banned_list.py exit non-zero. Module-level `#[allow(clippy::disallowed_methods, reason = ...)]` exists in five test-only places (src/quantize.rs:408 and src/tensor.rs:992 inside #[cfg(test)] modules, benches/matmul.rs:11, tests/analytic_oracle.rs:20, tests/calibration_oracle.rs:20), each with a reason; none in library code. The cell moves to pass when a CI job lints the pyo3 feature."

[G2]
status = "fail-known"
note = "no Law helper for max/min, no default-deny manifest of raw_* exceptions, and no clippy ban on f32::max / f32::min / f64::max / f64::min (clippy.toml lists none of them). The library computes f32/f64 max and min directly at: src/tensor.rs:336 and :561 (softmax row max, fold with f32::max), :448-454 and :494-500 (reduce max / min), :802-803; src/quantize.rs:121, :136-137, :200-201, :215-216, :270, :284-285, :361; src/training.rs:79; src/llama3_ternary.rs:583; src/calibration.rs:195 and :424 (the MIN_PROBABILITY floor in front of alice_det_math::ln64); src/ffi.rs:604, :617, :633, :648, :664; src/python.rs:388, :402, :441, :449; src/tensor.rs:271, :277, :307, :313 (`.max(0.0)` ReLU tails and fallbacks); src/error_analysis.rs:306 (f32 clamp) and :309 (f64 `.min(1.0)`); also f32::clamp (not named by the gate, same platform-visible NaN and signed-zero handling) at src/quantize.rs:141, :220, src/moe.rs:213, src/tensor.rs:528, :810. Probe measured 2026-10-15 and reverted: `pub const fn alice_probe(x: f32) -> f32 { x.max(0.5) }` in src/math.rs passed the ci.yml:87 command (rc=0) and `f32::min(x, 0.5)` passed the ci.yml:89 command (rc=0), so a new site would turn nothing red. SIMD widths: the crate builds an AVX2 path (feature simd, x86_64) and a NEON kernel (feature neon, src/neon.rs). The AVX2 path computes float max and min directly with intrinsics in src/tensor.rs: _mm256_max_ps at :265 and :301 (ReLU), _mm256_max_ps / _mm_max_ps / _mm_max_ss in the max reduction at :437-444, and _mm256_min_ps / _mm_min_ps / _mm_min_ss in the min reduction at :483-490; these have neither a Law helper nor a (+0, -0) / (-0, +0) test, so the per-width test list for the AVX2 width is empty and required. The NEON kernel (src/neon.rs) and src/ops.rs contain no float max or min (grep for vmax, vmin, .max(, .min(: only the usize call at src/ops.rs:463 and :509); that is an audit of the tree, not a gate."

[G3]
status = "unverified"
note = "no syntax-tree checker for an outer negation of an fma exists (scripts/ holds check_g1_banned_list.py, check_msrv.py and readme_sync.py only), which the gate names as its mechanism. What stands in its place is stricter and is itself a layer: clippy.toml bans f32::mul_add and f64::mul_add outright, and src, tests, examples and benches contain no mul_add call (grep over those directories: only comments, src/math.rs:15, src/ffi.rs:2, src/quantize.rs:8, src/llama3_ternary.rs:11, src/tensor.rs:7). Measured 2026-10-15 and reverted, each under the ci.yml:87 command: `-(x.mul_add(2.0, 1.0))` rc=101 `use of a disallowed method f32::mul_add`; `-1.0 * f32::mul_add(x, 2.0, 1.0)` rc=101; the same negated fma inside a macro_rules! definition used once, rc=101 (clippy reads the expansion). Not read: src/python.rs under the pyo3 feature (see G1): the same `-(x.mul_add(2.0, 1.0))` added to src/python.rs passed the ci.yml:89 command (rc=0). So the claim holds for the feature sets CI lints, by a ban rather than by the named checker, and the pyo3 feature is a checker hole. The dynamic backstop (G4 cancellation goldens on an aarch64 release leg) is absent (see G4, G5)."

[G4]
status = "fail-known"
note = "no signed-zero or exact-cancellation golden exists: tests/ holds tests/analytic_oracle.rs (closed-form comparisons), tests/calibration_oracle.rs (tolerance comparisons against analytic values) and tests/g1_disallowed_methods_complete.rs (the lint list), none of which fixes an expected bit pattern for a signed-zero or exact-cancellation case. The only bit-level assertions are the f16 and bf16 to f32 conversion cases in tests/analytic_oracle.rs (e.g. the 0x8000 to -0.0 case compared with to_bits at about line 1191), which test a format conversion, not a Law site. CI runs the tests in debug only: ci.yml:33, :35, :37 (`cargo test --lib --tests` on ubuntu-latest, x86_64) and ci.yml:53 (neon, macos-latest, aarch64); no workflow has `--release` for a test (grep over .github/workflows: the only `release` tokens are `cargo semver-checks check-release` in security-audit.yml:245 and the msrv job's empty RUSTFLAGS), so the {debug, release} x {x86_64, aarch64} legs are not present as required jobs. Measured 2026-10-15: the suite passes in both profiles on aarch64 (`cargo test --lib --tests` and `cargo test --release --lib --tests`: 217 + 24 + 30 + 3 passed, 0 failed), so adding the release legs does not start from a red suite."

[G5]
status = "fail-known"
note = "no CI job runs the test suite under the release profile, on aarch64 or anywhere: the test job (ci.yml:26-37) runs `cargo test --lib --tests` three times in debug on ubuntu-latest, the neon job (ci.yml:41-53) runs it in debug on macos-latest (aarch64), and no step passes --release to cargo test (see G4 for the grep). The required aarch64 release leg, the one that executes a hardware fma instruction, does not exist."

[G6]
status = "fail-known"
note = "the crate exports no semantics identifier: src/lib.rs has no SEMANTICS_ID or equivalent (grep for SEMANTICS_ID and semantics over src and tests: 0), so there is no hex test and no pin-change test. The upstream identifier it would fold exists: alice-det-math 0.5.1 (Cargo.lock) exports SEMANTICS_ID at its src/lib.rs:148, and this crate calls into it for exp / ln / log2 / log10 / powf / powi / sin_cos / sqrt64 and the 64-bit exp, ln and powf (31 uses of alice_det_math in src), but does not re-export, fold or pin it. Whether this crate's float outputs are Law-bearing in the sense of docs/CONFORMANCE.md (its Out of scope section names ML float activations and inference numerics as outside) is a decision for the owner; calibration (src/calibration.rs) and the ternary quantisation scale are the candidates, because they feed alice_det_math functions and are stored or compared."

[G7]
status = "unverified"
note = "audit, not decided. The crate's type-erasing boundaries: 67 `extern \"C\" fn` in src/ffi.rs (feature ffi; the arena, tensor, weight and model entry points, each wrapped by `guarded` at src/ffi.rs:77), 13 #[pyfunction] exports in src/python.rs (feature pyo3), the byte readers ModelArchive::deserialize (src/model_io.rs:114), StreamingModel::from_bytes (src/streaming.rs:160) and SafetensorsFile::parse (src/safetensors.rs:349), and the optional alice-db sink (src/db_bridge.rs, feature db); there is no build.rs, no procedural macro and no dyn Any or name-keyed registry. No boundary in this list is seen to receive another Law-bearing crate's value (the FFI and Python entry points take raw f32 slices and weight handles; the alice-det-math calls are in-memory function calls that return plain f32 / f64), but that is read from the code, not produced by a scanner, and the question depends on G6, since without an identifier there is nothing to carry. Not claimed as n/a: that status needs a scanner finding zero sites and the mutant of adding one, and none exists."

[G8]
status = "fail-known"
note = "unmet at a located absence: ModelArchive::serialize (src/model_io.rs:90, reached by LlamaTernary::save_atml at src/llama3_ternary.rs:637) writes the 4-byte magic `ATML`, a u32 FORMAT_VERSION, the layer count, then per layer a name hash, shapes, an f32 scale and the packed ternary weights (src/model_io.rs:92-94 and the layer loop), with no semantics identifier field; ModelArchive::deserialize (src/model_io.rs:114-123) checks only the length, the magic and the version and returns None, never an identifier mismatch, and there is no check_semantics call. The optional ALICE-DB sink (src/db_bridge.rs, feature db) persists training metrics through the alice-db store, whose own format carries its own identifier; this crate adds none. Read under the premise stated in the header. Note for the owner: the scale is a mean of absolute values from IEEE basic operations (src/quantize.rs:121), not an alice_det_math result, so the stored bytes do not depend on the arithmetic identifier today; carrying one would be a format change. The list of write entry points (serialize, save_atml, db_bridge) is the evidence the gate wants and its completeness is audited, not scanned."

[G9]
status = "unverified"
note = "depends on G6 and G8: the crate has no identifier whose history could be audited. CHANGELOG.md records no identifier move; the only format version is FORMAT_VERSION = 1 of the ATML archive (src/model_io.rs:15) and it has not moved."

[G10]
status = "fail-known"
note = "no lint or scan bans run-varying sources: clippy.toml holds disallowed-methods only (no disallowed-types, nothing for SystemTime::now, Instant::now, Uuid, thread_rng or from_entropy) and no workflow or script scans for them. Today's src reads none of them: a grep of src for SystemTime, Instant, std::time, thread_rng, rand::, Uuid, from_entropy and RandomState finds nothing (rand is a dev-dependency used by tests and benches only, Cargo.toml). That is a one-off grep, not a gate: probes added to src/math.rs and reverted, `std::time::SystemTime::now()` under the ci.yml:87 command and `std::time::Instant::now()` under the ci.yml:89 command, both passed (rc=0)."

