[G13]
status = "fail-known"
note = "the gate does not exist in this crate: clippy.toml has no disallowed-types entry for HashMap / HashSet and no lint or scan covers their iteration, there is no allowlist of membership-only sites, and no order-independence test (neither the HashMap-order check nor an ordered-reduction test at two thread counts) is present. Audit of the tree, located: HashMap in src: src/safetensors.rs:7 (a BTreeMap under no_std at :10), the tensor table parsed at src/safetensors.rs:307 and exposed by SafetensorsFile::tensor_names (src/safetensors.rs:373-377, `self.tensors.keys()` collected into a Vec in map order, so the order differs between runs); its callers are tests only (src/safetensors.rs:594 and tests/analytic_oracle.rs:1145, which sort first). src/llama3_ternary.rs:329 takes a HashMap of scales and reads it by key (`get`, line 350), not by iteration. Parallel reduction: the only rayon use is src/ops.rs:415-422 (feature parallel), `par_chunks_mut(...).zip(par_chunks(...)).for_each` writing one output row per chunk, with no cross-thread float reduction, so the result does not depend on thread count; no test runs it at two thread counts. No Law-bearing float output reads an unspecified order today, and tensor_names is the one public API that returns one. The probe `m.values().copied().collect()` on a HashMap in src/math.rs passed the ci.yml:87 command (rc=0), so a new iteration site would turn nothing red. Not n/a: that status needs a scanner finding zero sites."

