[package]
name = "alice-ml"
version = "0.4.0"
edition = "2021"
rust-version = "1.87"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "1.58bit Ternary Inference Engine - Multiplication is expensive. Addition is all you need."
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/ext-sakamoro/ALICE-ML"
keywords = ["machine-learning", "inference", "quantization", "bitnet", "simd"]
categories = ["science", "no-std"]

[lib]
name = "alice_ml"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["std"]
std = []
ffi = ["std"]   # C-ABI FFI (51 extern "C" functions)
simd = []       # Enable hand-tuned SIMD kernels (AVX2 on x86_64)
neon = []       # Enable hand-tuned NEON kernels (ARM aarch64)
parallel = ["dep:rayon", "std"]  # Enable Rayon parallel batch processing (rayon は std 前提)
pyo3 = ["dep:pyo3", "dep:numpy", "std"]  # Python bindings
db = ["dep:alice-db", "std"]  # ALICE-DB training metrics persistence
safetensors = ["std"]  # Safetensors format parser + Llama-3 ternary inference

[dependencies]
# no_std build の float 超越関数 (src/math.rs、std build では未使用)
libm = "0.2"
# calibration の exp / ln 用 platform libm は target ごとに最終 ulp が異なり、
# 同じ予測から違う校正値が出てしまう crates.io 公開版なので path dep ではない
# (= sibling checkout が要らない)
alice-det-math = { git = "https://github.com/ext-sakamoro/ALICE-DetMath", rev = "2d01c63ff0849cf0ab82eafb89f87f1b729bd2a8", version = "0.5.2", default-features = false }
rayon = { version = "1.10", optional = true }
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
numpy = { version = "0.29", optional = true }
alice-db = { git = "https://github.com/ext-sakamoro/ALICE-DB", rev = "866b8f11575c0bc936bdb322450066625b49e449", version = "0.6", optional = true, default-features = false, features = ["fs"] }

[dev-dependencies]
# tests/determinism_golden.rs: SHA-256 of output bit patterns
sha2 = "0.10"
criterion = "0.5"
rand = "0.8"
tempfile = "3"
tokenizers = "0.23"
serde_json = "1"
toml = "0.8"

# safetensors feature 必須 (default build では llama3_ternary module が無い)
[[example]]
name = "elyza_ternary"
required-features = ["safetensors"]

[[example]]
name = "qwen_qat_test"
required-features = ["safetensors"]

[[bench]]
name = "matmul"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# `panic = "unwind"` (default) on purpose: every `extern "C"` entry point in
# src/ffi.rs runs inside `catch_unwind` (`guarded`) so a Rust panic becomes a
# sentinel + `am_ml_last_error` instead of aborting the host process;
# `panic = "abort"` would make that guard a no-op.

[profile.bench]
opt-level = 3
lto = "thin"
debug = false
codegen-units = 1
