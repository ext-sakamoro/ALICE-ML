# This list is the ALICE-Law G1 ("no-libm-direct") gate's "banned" methods
# (conformance/gates.toml in the ALICE-Law repo), for both f32 and f64, plus
# two methods this crate additionally restricts beyond what G1 requires.
#
# G1's own verdicts: everything below marked "not correctly rounded by IEEE
# 754" is the gate's "banned" list, verbatim reason. `sqrt` is G1 "allowed"
# (IEEE 754 requires correct rounding, so it is already cross-platform
# bit-exact) and is NOT on this list. `mul_add` is also G1 "allowed" (IEEE
# 754 fusedMultiplyAdd, single-rounding, bit-exact regardless of hardware FMA
# availability) but this crate bans it anyway, and `powi` is G1 "pending" (a
# cross-target measurement not yet concluded; G1 lets a crate ban it in the
# meantime) and this crate also bans it — both for crate-specific reasons
# given in their own entries below, not because G1 requires it.
#
# `tests/g1_disallowed_methods_complete.rs` re-states G1's banned-method list
# (a point-in-time copy, checked network-free) and asserts every one of them
# appears here as both f32:: and f64::; the CI job `law-g1-banned-list`
# (`scripts/check_g1_banned_list.py`) checks the same thing against G1's
# *live* list instead, fetched at the revision `.github/law-g1-pin` names.
#
# A genuine exception goes through a site-local
# `#[allow(clippy::disallowed_methods, reason = "...")]`, not a change to this
# file.
disallowed-methods = [
    { path = "f32::sin", reason = "not correctly rounded by IEEE 754; platform libm results differ; use alice_det_math::sin" },
    { path = "f32::cos", reason = "not correctly rounded by IEEE 754; platform libm results differ; use alice_det_math::cos" },
