    { path = "f64::hypot", reason = "not correctly rounded by IEEE 754; platform libm results differ; alice-det-math has no hypot64, use alice_det_math::sqrt64(a*a + b*b) instead" },
    { path = "f32::powi", reason = "G1 marks this pending (cross-target measurement not concluded); this crate bans it now: lowers to a compiler-rt routine with unspecified multiplication order; use alice_det_math::powi" },
    { path = "f64::powi", reason = "G1 marks this pending (cross-target measurement not concluded); this crate bans it now: lowers to a compiler-rt routine with unspecified multiplication order; use alice_det_math::powi" },
    { path = "f32::mul_add", reason = "G1 marks this allowed (single-rounding, not a drift source) but this crate bans it anyway: it rounds differently from a * b + c; this crate writes a * b + c everywhere" },
    { path = "f64::mul_add", reason = "G1 marks this allowed (single-rounding, not a drift source) but this crate bans it anyway: it rounds differently from a * b + c; this crate writes a * b + c everywhere" },
    # Law max / min (G2): the platform forms leave the zero sign and NaN to the target and
    # the optimiser (measured: tensor_max(+0, -0) was -0 on x86_64, +0 on aarch64)
    { path = "f32::max", reason = "zero sign and NaN handling differ by target and opt level; use alice_ml::law_math::max (IEEE maximumNumber, -0 < +0)" },
    { path = "f32::min", reason = "zero sign and NaN handling differ by target and opt level; use alice_ml::law_math::min (IEEE minimumNumber, -0 < +0)" },
    { path = "f64::max", reason = "zero sign and NaN handling differ by target and opt level; use alice_ml::law_math::max64" },
    { path = "f64::min", reason = "zero sign and NaN handling differ by target and opt level; use alice_ml::law_math::min64" },
    { path = "f32::clamp", reason = "takes the platform max / min for its bounds; use alice_ml::law_math::clamp (NaN stays NaN, zeros ordered)" },
    { path = "f64::clamp", reason = "takes the platform max / min for its bounds; use alice_ml::law_math::clamp64" },
    # Determinism gate (G10): no OS entropy and no wall clock in production code.
    { path = "std::time::Instant::now", reason = "the wall clock makes results depend on timing; pass time in or use a step count" },
    { path = "std::time::SystemTime::now", reason = "the wall clock makes results depend on timing; pass time in or use a step count" },
    { path = "std::time::Instant::elapsed", reason = "reads the wall clock the same as Instant::now; duration_since on an already-held value is fine, this reads the clock again" },
    { path = "std::time::SystemTime::elapsed", reason = "reads the wall clock the same as SystemTime::now; duration_since on an already-held value is fine, this reads the clock again" },
    { path = "std::collections::hash_map::RandomState::new", reason = "seeds from OS randomness and would make HashMap iteration order non-deterministic" },
]
disallowed-types = [
    { path = "std::collections::hash_map::RandomState", reason = "seeds from OS randomness and would make HashMap iteration order non-deterministic; see disallowed-methods for RandomState::new" },
]
