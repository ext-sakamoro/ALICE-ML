name: Security & Hygiene

# ALICE-* crate で共通の CI 構成
# ALICE-SDF v1.7.7 (commit 52d26f9) を base に ALICE-ML 用に調整
#
# 目的:
# - RustSec advisory (CVE) の週次検知
# - dep license 逸脱 (GPL 侵入等) の block
# - 未使用依存の炙り出し
# - 仮実装 (todo! / unimplemented! / panic!(STUB) / dbg!) の CI gate

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
      - '.github/actions/**'
  schedule:
    # 毎週月曜 09:00 UTC = 18:00 JST
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  audit:
    name: cargo audit (RustSec CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2


      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # advisory-db は audit 実行時に自動取得
      # yanked crate は deny、unmaintained warning は個別 ignore で管理
      - name: Run cargo audit
        run: |
          # RUSTSEC-2026-0235 (rkyv 0.7 Rc/Arc archive validation): rkyv is reached only
          # through alice-db (db feature), whose archived types (SegmentMetadata / DataSegment /
          # ModelType / DataType) hold no Rc / Arc, so the advisory does not apply. This crate
          # neither depends on rkyv nor archives anything; scripts/no_direct_rkyv.py fails as soon
          # as either changes. The root fix is alice-db moving off rkyv 0.7 (pending); the entry
          # goes when that release is consumed.
          # (pyo3 0.29 / tokenizers 0.23 bump で 2025-0020 / 2026-0176 / 2026-0177 / number_prefix は解消済)
          cargo audit --deny yanked \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2026-0192 \
            --ignore RUSTSEC-2026-0235

  deny:
    name: cargo-deny (license + advisories + bans + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2


      # EmbarkStudios/cargo-deny-action@v2 は Docker container 内で稼働し、
      # /github/workspace のみ mount するため sibling path dep が見えず fail する
      # 直接 install で回避
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run cargo deny check all
        run: cargo deny --all-features check all

  unused-deps:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable


      # false-positive は Cargo.toml の [package.metadata.cargo-machete] ignored で除外
      - uses: bnjbvr/cargo-machete@main

  stub-guard:
    name: Stub / mock / dbg guard (grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 仮実装 (stub) を本番の code に残さない
      # canonical 罠 catalog #9-b/#9-c 準拠 (comment 行は除外)
      - name: Detect panic!(STUB) / dbg!() in src/** (block)
        run: |
          set -eo pipefail
          # Block: panic!(STUB...) (explicit STUB marker) + dbg!() (debug residual)
          # comment 行 (// or /*) は除外
          hits=$(grep -rnE 'panic!\([^)]*STUB|dbg!\(' \
            src/ --include="*.rs" \
            --exclude-dir=bin \
            | grep -v ':[[:space:]]*//' \
            | grep -vE ':[[:space:]]*/\*' \
            || true)
          if [ -n "$hits" ]; then
            echo "❌ panic!(STUB) / dbg!() detected in src/ (production path):"
            echo "$hits"
            echo ""
            echo "Fix: use ? operator, Result<T, E>, or remove the marker."
            echo "  A stub must fail fast (todo!() / unimplemented!()), not return a silent Ok."
            exit 1
          fi
          echo "✓ No panic!(STUB) / dbg!() in src/ (excluding src/bin/)"

      - name: Detect todo!() / unimplemented!() in src/** (informational)
        run: |
          set -eo pipefail
          # Informational: todo!() / unimplemented!() は legitimate な fail-fast idiom
          # (未実装は必ず fail fast させる)
          hits=$(grep -rnE 'todo!\(|unimplemented!\(' \
            src/ --include="*.rs" \
            --exclude-dir=bin \
            | grep -v ':[[:space:]]*//' \
            | grep -vE ':[[:space:]]*/\*' \
            || true)
          if [ -n "$hits" ]; then
            count=$(echo "$hits" | wc -l | tr -d ' ')
            echo "::warning::todo!() / unimplemented!() found in src/ ($count markers, informational):"
            echo "$hits" | head -50
          else
            echo "✓ No todo!() / unimplemented!() in src/"
          fi

      - name: Detect TODO / FIXME / XXX / HACK (informational)
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'TODO|FIXME|XXX|HACK' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "::warning::TODO/FIXME/XXX/HACK found in src/ (informational, not blocking):"
            echo "$hits" | head -50
          else
            echo "✓ No TODO/FIXME/XXX/HACK in src/"
          fi

  package-integrity:
    name: Package integrity (publish される .crate が build できるか)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # publish される .crate に必要な file が全部入っているかを見る
      #
      # include_str! / include_bytes! が package 境界を越える、exclude を効かせ過ぎる、
      # 必要 file が漏れる — これらは repo / workspace に file がある限り
      # cargo build も cargo test も clippy も preflight も全部通り、
      # crates.io から取得した利用者だけが compile 不能になる
      # (2026-09-28 ALICE-LOL lol.gbnf)
      #
      # semver-checks は baseline を build するので結果的に検出するが、
      # (a) 壊れた版を publish した後にしか分からない
      # (b) 未 publish crate は baseline が無く発火しない ので予防にならない
      - name: cargo package (.crate を作る)
        # --no-verify: 未 publish の sibling に path dep がある repo では verify step が
        #   registry 解決で落ちる 展開後の隔離 build が本体なので verify は不要
        run: cargo package --no-verify --allow-dirty

      - name: 展開して隔離 build
        run: |
          set -euo pipefail
          crate=$(find target/package -maxdepth 1 -name '*.crate' | head -1)
          [ -n "$crate" ] || { echo "::error::.crate が生成されていない"; exit 1; }
          echo "packaged: $(basename "$crate") ($(du -h "$crate" | cut -f1))"
          tmp=$(mktemp -d)
          tar xzf "$crate" -C "$tmp"
          cd "$tmp"/*/
          # 親 workspace を継承すると member 扱いになり、境界を越えた file が
          # 再び見えてしまう (検査の意味が消える) ので単独 package として build
          printf '\n[workspace]\n' >> Cargo.toml
          cargo check --all-features

  coverage:
    name: Coverage (cargo-llvm-cov、informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2


      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        run: |
          cargo llvm-cov --lib --summary-only 2>&1 | tee coverage-summary.txt

      - name: Upload coverage summary as artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-summary
          path: coverage-summary.txt
          retention-days: 30
