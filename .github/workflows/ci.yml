name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create dependency stubs
        run: |
          # dir:crate:version — version は Cargo.toml 要件 (alice-db ^0.2.0-beta.1) を満たすこと
          for crate_info in \
            "ALICE-DB:alice-db:0.2.0-beta.1"; do
            dir=$(echo "$crate_info" | cut -d: -f1)
            pkg=$(echo "$crate_info" | cut -d: -f2)
            ver=$(echo "$crate_info" | cut -d: -f3)
            mkdir -p "../$dir/src"
            cat > "../$dir/Cargo.toml" << TOML
          [package]
          name = "$pkg"
          version = "$ver"
          edition = "2021"
          license = "MIT OR Apache-2.0"
          [features]
          default = []
          std = []
          TOML
            echo "" > "../$dir/src/lib.rs"
          done
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib --tests
      - run: cargo test --lib --tests --features simd

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create dependency stubs
        run: |
          # dir:crate:version — version は Cargo.toml 要件 (alice-db ^0.2.0-beta.1) を満たすこと
          for crate_info in \
            "ALICE-DB:alice-db:0.2.0-beta.1"; do
            dir=$(echo "$crate_info" | cut -d: -f1)
            pkg=$(echo "$crate_info" | cut -d: -f2)
            ver=$(echo "$crate_info" | cut -d: -f3)
            mkdir -p "../$dir/src"
            cat > "../$dir/Cargo.toml" << TOML
          [package]
          name = "$pkg"
          version = "$ver"
          edition = "2021"
          license = "MIT OR Apache-2.0"
          [features]
          default = []
          std = []
          TOML
            echo "" > "../$dir/src/lib.rs"
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --lib --tests --features simd -- -W clippy::pedantic -W clippy::nursery -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create dependency stubs
        run: |
          # dir:crate:version — version は Cargo.toml 要件 (alice-db ^0.2.0-beta.1) を満たすこと
          for crate_info in \
            "ALICE-DB:alice-db:0.2.0-beta.1"; do
            dir=$(echo "$crate_info" | cut -d: -f1)
            pkg=$(echo "$crate_info" | cut -d: -f2)
            ver=$(echo "$crate_info" | cut -d: -f3)
            mkdir -p "../$dir/src"
            cat > "../$dir/Cargo.toml" << TOML
          [package]
          name = "$pkg"
          version = "$ver"
          edition = "2021"
          license = "MIT OR Apache-2.0"
          [features]
          default = []
          std = []
          TOML
            echo "" > "../$dir/src/lib.rs"
          done
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
