name: CI

# ALICE-* crate で共通の CI 構成
# 2026-09-15 強化:
# - clippy を `--all-targets` + full native feature set で `-D warnings` (feature-gated module
#   ffi / safetensors / llama3_ternary が従来は未 lint、38 件が silent だった)
# - no_std job: `crate-type = ["rlib", "staticlib", "cdylib"]` のため `cargo check --no-default-features`
#   は cdylib の panic_handler / allocator 要求で落ちる → `cargo rustc --crate-type rlib` で検証、
#   bare-metal target (thumbv7em) で本物の no_std を証明 (2026-09-15 まで no_std build は一度も通っておらず
#   CI も見ていなかった = claim が偽だった)
# - feature-powerset: std 固定で depth 2 (pyo3 = Python toolchain / neon = aarch64 のみ、除外; db は crates.io の alice-db 実体で check)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # full native feature set (pyo3 / neon を除く、clippy / test / doc で共用)
  NATIVE_FEATURES: "ffi,simd,parallel,safetensors,db"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (default)
        run: cargo test --lib --tests
      - name: Test (simd)
        # the AVX2 max / min lanes of src/law_math.rs are checked against the scalar
        # helpers on this x86_64 runner (the test fails if AVX2 is missing)
        env:
          ALICE_ML_REQUIRE_AVX2: "1"
        run: cargo test --lib --tests --features simd
      - name: Test (full native feature set)
        # the AVX2 max / min lanes of src/law_math.rs are checked against the scalar
        # helpers on this x86_64 runner (the test fails if AVX2 is missing)
        env:
          ALICE_ML_REQUIRE_AVX2: "1"
        run: cargo test --lib --tests --features "$NATIVE_FEATURES"
      # the same lane test alone, with its output, so the log shows the number of
      # pairs it compared (a pass with no line means it did not run)
      - name: AVX2 lane test of the Law max / min (count in the log)
        env:
          ALICE_ML_REQUIRE_AVX2: "1"
        run: cargo test --lib --features simd law_math::tests::avx2_lanes_equal_the_scalar_helpers_over_every_pair -- --exact --nocapture

  float-environment:
    # ALICE-Law G14 on each OS: round-to-nearest-even and no flush-to-zero at run
    # time in both profiles (scripts/run_tests.sh float_environment=2 fails unless
    # both tests passed), the static build configuration guard, and on ubuntu /
    # macOS the flags cargo really passes to rustc, read from `-v` in a fresh
    # target directory (scripts/build_flags_check.py)
    name: Float environment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Float environment (debug and release)
        run: |
          scripts/run_tests.sh float_environment=2 -- cargo test --test float_environment
          scripts/run_tests.sh float_environment=2 -- cargo test --release --test float_environment
      - name: run_tests.sh and build configuration guard (tests, then check)
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_run_tests.py
          "$PY" scripts/test_build_config_guard.py
          "$PY" scripts/build_config_guard.py
          "$PY" scripts/test_build_flags_check.py
      # no_std is checked as an rlib (the cdylib / staticlib need std's allocator and
      # panic handler), as the no_std job does
      - name: Effective rustc flags (default, full native feature set, no default features)
        if: runner.os != 'Windows'
        run: |
          python3 scripts/build_flags_check.py -- cargo check --release --lib
          python3 scripts/build_flags_check.py -- cargo check --release --lib --features "$NATIVE_FEATURES"
          python3 scripts/build_flags_check.py -- cargo rustc --release --lib --no-default-features --crate-type rlib

  # aarch64 runner: the NEON kernel (`neon` feature, cfg(target_arch = "aarch64"))
  # is held to the same closed-form oracle as the scalar / AVX2 paths
  neon:
    name: neon (aarch64, macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (neon, all targets, pedantic + nursery)
        run: cargo clippy --features "$NATIVE_FEATURES,neon" --all-targets -- -W clippy::pedantic -W clippy::nursery -D warnings
      - name: Test (neon)
        run: cargo test --lib --tests --features "$NATIVE_FEATURES,neon"

  no_std:
    name: no_std (rlib、host + bare-metal thumbv7em)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build (no_std, host)
        run: cargo rustc --lib --no-default-features --crate-type rlib
      - name: Build (no_std + simd, host)
        run: cargo rustc --lib --no-default-features --features simd --crate-type rlib
      - name: Build (no_std, bare-metal thumbv7em-none-eabihf)
        run: cargo rustc --lib --no-default-features --crate-type rlib --target thumbv7em-none-eabihf
      # cargo clippy は crate-type を上書きできないので clippy-driver を wrapper で差す
      - name: Clippy (no_std, pedantic + nursery)
        run: >-
          RUSTC_WORKSPACE_WRAPPER="$(rustup which clippy-driver)"
          cargo rustc --lib --no-default-features --crate-type rlib --
          -W clippy::pedantic -W clippy::nursery -D warnings

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default features, all targets)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (full native feature set, all targets, pedantic + nursery)
        run: cargo clippy --features "$NATIVE_FEATURES" --all-targets -- -W clippy::pedantic -W clippy::nursery -D warnings
      # the lists in clippy.toml only gate anything if clippy flags a call to
      # them: a throwaway crate with the same clippy.toml plants one banned call
      # per row of scripts/clippy_canary_calls.tsv (0 rows fail). The rows are
      # generated from clippy.toml, one per disallowed-methods / disallowed-types
      # entry; --check fails when the file has drifted from clippy.toml
      - name: Clippy canary data (generator tests)
        run: python3 scripts/test_gen_clippy_canary_calls.py
      - name: Clippy canary data (generated from clippy.toml, no drift)
        run: python3 scripts/gen_clippy_canary_calls.py --check
      - name: Clippy canary (tests)
        run: python3 scripts/test_clippy_canary.py
      - name: Clippy canary (every planted banned call is flagged)
        run: python3 scripts/clippy_canary.py

  feature-powerset:
    name: Feature powerset (cargo-hack, std 固定, depth 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      # std 固定: std なしの組合せは cdylib link 要求で落ちるため no_std job 側で rlib として検証
      - name: Powerset (std + {ffi, simd, parallel, safetensors} depth 2)
        run: cargo hack check --lib --feature-powerset --depth 2 --exclude-features pyo3,neon --features std

  # Cargo.toml の rust-version で実際に build する (rust-toolchain.toml の開発用 pin は
  # RUSTUP_TOOLCHAIN で上書きする) toolchain の版は rust-version と同じ値でなければ
  # scripts/check_msrv.py が落とす 比較 0 件も落とす
  msrv:
    name: msrv (Cargo.toml の rust-version で build)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.87"
      RUSTFLAGS: ""
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: check_msrv oracle (検査器自身の試験)
        run: python3 scripts/test_check_msrv.py
      - name: check_msrv (rust-version と toolchain の版が一致し、実 rustc がその版か)
        run: python3 scripts/check_msrv.py --rustc
      - name: Check (default + full native feature set, all targets)
        run: |
          cargo check --all-targets
          cargo check --all-targets --features "$NATIVE_FEATURES"
      - name: Build tests (full native feature set)
        run: cargo test --no-run --lib --tests --features "$NATIVE_FEATURES"
      - name: Build (no_std rlib)
        run: cargo rustc --lib --no-default-features --crate-type rlib

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

      # This crate must not depend on rkyv directly or archive anything through it
      # (scripts/no_direct_rkyv.py, kept byte-identical across repositories)
      - name: no-direct-rkyv guard (tests)
        run: python3 scripts/test_no_direct_rkyv.py
      - name: no-direct-rkyv guard
        run: python3 scripts/no_direct_rkyv.py

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Doc (full native feature set)
        run: cargo doc --no-deps --features "$NATIVE_FEATURES"
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

  readme-sync:
    name: readme_sync (README / README_JP / docs/MODULES.md が code と一致)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: readme_sync oracle (検査器自身の試験)
        run: python3 scripts/test_readme_sync.py
      - name: readme_sync (README / README_JP / docs/MODULES.md の check)
        run: python3 scripts/readme_sync.py --check

  law-g1-banned-list:
    name: ALICE-Law G1 の banned 一覧と clippy.toml の突合 (.github/law-g1-pin に固定)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: check_g1_banned_list oracle (検査器自身の試験)
        run: python3 scripts/test_check_g1_banned_list.py
      - name: check_g1_banned_list (clippy.toml が .github/law-g1-pin の G1 一覧を全部 ban しているか)
        run: python3 scripts/check_g1_banned_list.py
