name: 'ALICE-ML Optional Bridge Stubs'
description: |
  Composite action that creates sibling path-dep stubs for ALICE-ML.

  Canonical CI template: [[reference_alice_ci_canonical_template]]

  - license = "MIT OR Apache-2.0" 必須 (canonical 罠 #2、cargo-deny "unlicensed" reject 予防)
  - version は Cargo.toml の要件を満たすこと (stub が古いと cargo update / audit / deny が
    「failed to select a version」で全滅、2026-09-14 事案: alice-db 要件 ^0.2.0-beta.1 に対し
    本 action が no-op のまま + ci.yml stub 0.1.0)

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        # dir:crate:version
        for entry in \
            ALICE-DB:alice-db:0.2.0-beta.1; do
          dir="${entry%%:*}"
          rest="${entry#*:}"
          crate="${rest%%:*}"
          version="${rest#*:}"
          mkdir -p "../${dir}/src"
          cat > "../${dir}/Cargo.toml" <<TOML
        [package]
        name = "${crate}"
        version = "${version}"
        edition = "2021"
        license = "MIT OR Apache-2.0"

        [features]
        default = []
        std = []

        [lib]
        path = "src/lib.rs"
        TOML
          : > "../${dir}/src/lib.rs"
          echo "stub ${crate} ${version} -> ../${dir}"
        done
