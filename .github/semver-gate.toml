# scripts/semver_gate.py: the equal-version mode of alice-ml
#
# [crate.alice-ml] in ALICE-Law release-train.toml declares no consumer feature sets, so
# the gate builds the default features, no default features, and every feature at once;
# consumer-features here stays unset to match the roster
#
# Only the host architecture is compared: rustdoc documents the items of the target it runs
# on, so on the CI runner (ubuntu-latest, x86_64) the `neon` module (cfg(target_arch =
# "aarch64")) is not seen, and on an aarch64 machine the x86_64 `simd` kernels in tensor.rs
# are not. A change to an item of the other architecture is not checked here
#
# Cargo.toml keeps the released version while changes accumulate under [Unreleased]; the
# version is raised when the release is cut. An equal version is checked as the smallest
# next release (0.3.0 -> 0.3.1 once 0.3.0 is published, a minor step under Cargo's 0.x
# rules); until then 0.2.0 -> 0.3.0 is a major step, in which any change is allowed
equal-version = "next-smallest-step"
