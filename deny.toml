# cargo-deny 設定 (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# canonical CI template: [[reference_alice_ci_canonical_template]]
# ALICE-SDF v1.7.7 (commit 52d26f9) の deny.toml を base に ALICE-ML 用に調整
#
# ALICE-ML 自体は MIT OR Apache-2.0 (permissive) のため自己 exception 不要
# sibling dep は crates.io の alice-db (db feature) のみ、path dep / CI stub は 0

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec CVE + yanked)
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
    # rkyv 0.7 Rc/Arc archive validation OOB (alice-db 経由 transitive、local path dep のみ): alice-db の
    # archived 型に Rc/Arc 無し = 非該当 (alice-db 側の判定と同期、CI も crates.io の alice-db 実体で check)
    "RUSTSEC-2026-0235",
    # bincode 2.x unmaintained (postcard 移行コスト高)
    "RUSTSEC-2025-0141",
    # paste 1.0.15 unmaintained (pyo3-macros / bytemuck transitive)
    "RUSTSEC-2024-0436",
    # ttf-parser unmaintained (font 描画系 transitive、alice-ml 直接無使用だが transitive 出現時 guard)
    "RUSTSEC-2026-0192",
    # RSA Marvin attack (transitive、sqlx 経由等)
    "RUSTSEC-2023-0071",
    # atty unmaintained (transitive)
    "RUSTSEC-2024-0375",
    # canonical ignore set (Tier 3 wave 3 template)
    "RUSTSEC-2025-0020",
    "RUSTSEC-2026-0176",
    "RUSTSEC-2026-0177",
    "RUSTSEC-2026-0204",
]

# ---------------------------------------------------------------------------
# Licenses (allow-list 方式)
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    # Font-related licenses (transitive font-lib 経由)
    "OFL-1.1",           # SIL Open Font License (Ubuntu Mono / Noto 等)
    "Ubuntu-font-1.0",   # Ubuntu Font License
    # LLVM ecosystem
    "NCSA",              # libfuzzer-sys / LLVM related
    # Community Data License
    "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
version = "*"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# alice-ml 自身 (target crate) が AGPL-3.0-or-later、cargo-deny は target も license check するため自己許可
[[licenses.exceptions]]
name = "alice-ml"
allow = ["AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"]

# AGPL sibling dep (db feature、crates.io の alice-db 0.2.0-beta.2)
[[licenses.exceptions]]
name = "alice-db"
allow = ["AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"]

# ---------------------------------------------------------------------------
# Bans (banned crate / duplicate / wildcard)
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"   # path dep が wildcard version になるため必須
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
